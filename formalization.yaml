# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: "The Conway–Soifer conjecture for n = 3: a Lean formalization"
  description: >-
    For every positive epsilon, a closed equilateral triangle of side
    3 + epsilon cannot be covered by ten closed unit equilateral triangles,
    with arbitrary positions, rotations and overlaps. Equivalently, ten
    congruent equilateral triangles covering an equilateral triangle of side
    three must have common side at least one. The computer-assisted proof
    uses 100 finite certificates and 3188 forced point-to-owner assignments.
    Only the n = 3 case is claimed.
  authors:
    - Vladislav Kuznetsov
  responsible_maintainers:
    - Vladislav Kuznetsov (GitHub AnanasClassic)
  license: MIT

sources:
  - title: "Computer-assisted proof of the Conway–Soifer covering conjecture for n = 3"
    authors:
      - Vladislav Kuznetsov
    id: https://doi.org/10.5281/zenodo.22712658
    type: original-proof
    relationship: other
    author_endorsement: participated
    note: >-
      The repository contains the substantive proof development, extracted
      from the author's research repository. The DOI identifies its original
      public v1.0.0 snapshot. This is an original proof development with Codex
      assistance; this classification makes no priority or peer-review claim.
      See PROVENANCE.md for the precise extraction history.
  - title: >-
      An Equilateral Triangle of Side > n Cannot be Covered by n² + 1 Unit
      Equilateral Triangles Homothetic to it
    authors:
      - Jineon Baek
      - Seewoo Lee
    id: https://doi.org/10.1080/00029890.2024.2416882
    type: article
    location: "Conjecture 2; The American Mathematical Monthly 132(2), 2025, pp. 113–121"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Conjecture 2 states the unrestricted covering problem attributed to
      Conway and Soifer. The article proves a result with a homothety
      restriction for general n. This repository treats n = 3 with arbitrary
      rotations and does not formalize that article's proof.

