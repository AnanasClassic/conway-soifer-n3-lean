status:
  scope: >-
    The n = 3 covering lower bound and its scaled unit-triangle formulation.
    No result for general n or an eleven-triangle construction is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: ConwaySoifer.ten_triangle_cover_lower_bound
      file: ConwaySoifer.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies: []
    - declaration: ConwaySoifer.no_ten_unit_triangle_cover
      file: ConwaySoifer.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies: []

automation:
  methods:
    - method: agent
      framework: OpenAI Codex
      tool_setup: >-
        Agent-assisted mathematical development, Lean proof development,
        debugging, repository preparation and verification tooling, under
        the author's direction. Python proposed finite certificates and
        checkpoint data; Lean checks their sufficiency and soundness.
      prompting_notes: >-
        The author requested a proof of the unrestricted n = 3 covering
        problem, a full Lean formalization, simplification, kernel checking,
        and a standalone reproducible public package.
  notes: >-
    Exact historical model identifiers, token counts and aggregate costs
    were not recorded in the public source history and are not inferred here.
    Concrete certificate checks use decide +kernel, not native_decide.
    Search software is not part of the proof's trusted inputs.

fidelity:
  divergences: >-
    The target is fixed in triangular coordinates (a,b) representing the
    Euclidean point (a+b/2, sqrt(3)*b/2); the squared distance is
    da^2 + da*db + db^2. This invertible linear presentation preserves convex
    hulls. The closed target's vertices are (1,1), (-2,1), (1,-2), with side
    three. Fixing its position does not restrict the isometry-invariant
    covering question. Covering triangles are convex hulls of equidistant
    vertices, with unrestricted positions, rotations and overlaps; even
    zero-side degeneracies are admitted. The scaled theorem covers every
    positive epsilon. The two explicit Euclidean coordinate/isometry
    interpretations are explained informally rather than exposed as
    separately compared Lean equivalence theorems.

review:
  status: agent-reviewed
  notes: >-
    Development and packaging received automated checks and agent review.
    No independent mathematical review or peer review is claimed. The
    published v1.0.0 passed the recorded Lean 4.24 build and axiom audit;
    that historical result is not evidence that a later port or Comparator
    run passed. Consult CI for the exact commit under consideration.
    The two deliberate sorry placeholders in Challenge.lean are excluded
    from status.sorry_count and are never imported by the proof module.
    A Palomar mechanical preflight does not constitute registry publication
    or editorial review.

alignment:
  namespace: ConwaySoifer
  statements:
    - source: "Conjecture 2, restricted to n = 3"
      lean: ConwaySoifer.no_ten_unit_triangle_cover
      module: ConwaySoifer.lean
      status: proved
      note: "Every positive epsilon; ten unit triangles with arbitrary rotations."
    - source: "Equivalent normalized side-length lower bound"
      lean: ConwaySoifer.ten_triangle_cover_lower_bound
      module: ConwaySoifer.lean
      status: proved
      note: "Every common side r; a cover of the whole closed side-three target."

